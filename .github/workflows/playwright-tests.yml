name: RealTec QA Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test tests/checkout/full-order-flow.spec.ts

      - name: Send Slack Notification
        if: always()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_TITLE: '🛠️ RealTec Office: Automation Results'
          SLACK_MESSAGE: |
            *Project:* RealTec Web Automation
            *Status:* ${{ job.status == 'success' && '🟢 Success' || '🔴 Failed' }}
            *Executed By:* ${{ github.actor }}
          SLACK_COLOR: ${{ job.status == 'success' && '#2EB67D' || '#E01E5A' }}