name: RealTec QA Regression

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Every night at 12 AM automatically
  workflow_dispatch:       # Manual run from GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      test_status: ${{ steps.set_test_status.outputs.test_status }}
      slack_status_text: ${{ steps.set_test_status.outputs.slack_status_text }}
      slack_color: ${{ steps.set_test_status.outputs.slack_color }}

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js version 18
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Step 3: Install all npm dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Step 5: Run full regression test suite
      - name: Run Playwright Regression Tests
        id: run_tests
        run: |
          set +e
          npx playwright test --workers=1
          TEST_EXIT_CODE=$?
          echo "test_exit_code=$TEST_EXIT_CODE" >> "$GITHUB_OUTPUT"
          exit 0
        continue-on-error: true

      - name: Set test status for Slack
        id: set_test_status
        if: always()
        run: |
          if [ "${{ steps.run_tests.outputs.test_exit_code }}" != "0" ]; then
            echo "test_status=failed" >> "$GITHUB_OUTPUT"
            echo "slack_status_text=🔴 Failed" >> "$GITHUB_OUTPUT"
            echo "slack_color=#E01E5A" >> "$GITHUB_OUTPUT"
          else
            echo "test_status=passed" >> "$GITHUB_OUTPUT"
            echo "slack_status_text=🟢 Passed" >> "$GITHUB_OUTPUT"
            echo "slack_color=#2EB67D" >> "$GITHUB_OUTPUT"
          fi

      # Step 6: Upload HTML test report as artifact
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Step 7: Send Slack notification with result
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          # Support either secret naming convention.
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL || secrets.SLACK_WEBHOOK }}
          # Prefer channel ID/name from secrets; fallback to current default.
          SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL || '#qa-automation' }}
          SLACK_TITLE: 'RealTec QA Regression Results'
          SLACK_MESSAGE: |
            *Project:* RealTec QA Automation
            *Branch:* ${{ github.ref_name }}
            *Triggered By:* ${{ github.event_name }}
            *Executed By:* ${{ github.actor }}
            *Status:* ${{ steps.set_test_status.outputs.slack_status_text }}
            *Report:* Check GitHub Actions artifacts for full HTML report
          SLACK_COLOR: ${{ steps.set_test_status.outputs.slack_color }}
          SLACK_USERNAME: 'QA Automation Bot'
          SLACK_ICON_EMOJI: ':robot_face:'
