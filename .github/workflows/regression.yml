name: RealTec QA Regression

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Every night at 12 AM automatically
  workflow_dispatch:       # Manual run from GitHub Actions tab

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Setup Node.js version 18
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Step 3: Install all npm dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Install Playwright browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # Step 5: Run full regression test suite
      - name: Run Playwright Regression Tests
        run: npx playwright test --workers=1
        continue-on-error: true

      # Step 6: Upload HTML test report as artifact
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # Step 7: Send Slack notification with result
      - name: Notify Slack
        uses: rtCamp/action-slack-notify@v2
        if: always()
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_CHANNEL: '#qa-automation'
          SLACK_TITLE: 'RealTec QA Regression Results'
          SLACK_MESSAGE: |
            *Project:* RealTec QA Automation
            *Branch:* ${{ github.ref_name }}
            *Triggered By:* ${{ github.event_name }}
            *Executed By:* ${{ github.actor }}
            *Status:* ${{ job.status == 'success' && '🟢 Passed' || '🔴 Failed' }}
            *Report:* Check GitHub Actions artifacts for full HTML report
          SLACK_COLOR: ${{ job.status == 'success' && '#2EB67D' || '#E01E5A' }}
          SLACK_USERNAME: 'QA Automation Bot'
          SLACK_ICON_EMOJI: ':robot_face:'
